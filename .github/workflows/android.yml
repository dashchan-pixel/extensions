name: Dashchan Extensions Build

on:
  push:
    branches: [ "rework", "master" ]
    
env:
  KEYSTORE_FILENAME: ${{ secrets.KEYSTORE_FILENAME }}
  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
  RELEASE_SIGN_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
  RELEASE_SIGN_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build modules
    strategy:
      fail-fast: false
      matrix:
        package:
          - module: arhivach
            name: Arhivach
          - module: dvach
            name: Dvach
          - module: fourchan
            name: Fourchan
          - module: local
            name: Local

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Checkout keystore - for ${{ matrix.package.name }}
      if: ${{ secrets.KEYSTORE_DASHCHAN_REPO != '' && secrets.ACCESS_TOKEN != '' }}
      uses: actions/checkout@v4
      with:
        repository: ${{ secrets.KEYSTORE_DASHCHAN_REPO }}
        token: ${{ secrets.ACCESS_TOKEN }}
        path: chans/${{ matrix.package.module }}/keystore

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build ${{ matrix.package.name }} with Gradle
      run: ./gradlew :chans:${{ matrix.package.module }}:assembleRelease

    - name: Upload APK - ${{ matrix.package.name }}
      uses: actions/upload-artifact@v4
      with:
        name: Dashchan${{ matrix.package.name }}.apk
        path: chans/${{ matrix.package.module }}/build/outputs/apk/release/Dashchan${{ matrix.package.name }}-release.apk

