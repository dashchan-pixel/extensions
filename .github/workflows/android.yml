name: Release

# Pushing a tag named <extension>-<version> (e.g. endchan-26.7.2), where <version> equals the
# newest metadata/<extension>/versions.json entry, builds that one extension's release APK,
# publishes it as its own GitHub release and merges it into update/data-v1.json on the default
# branch. Extensions are versioned and released independently: every other application keeps
# the manifest entry describing its own last release, so their versions never have to agree.

on:
  push:
    tags:
      # Rejects the plain version tags of the lockstep releases published before the split.
      - '*-[0-9]+.[0-9]+*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check signing secret
        run: |
          if [ -z "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "RELEASE_KEYSTORE_BASE64 secret is not set; the build would silently fall" \
                 "back to the debug key and every published APK would be unusable as an" \
                 "update of a release-signed install" >&2
            exit 1
          fi

      - name: Resolve the tag to an extension
        id: extension
        run: |
          python3 - "$GITHUB_REF_NAME" <<'EOF'
          import json, os, pathlib, sys
          tag = sys.argv[1]
          # Extension names carry no dash, so the first one separates name from version.
          name, _, version = tag.partition('-')
          source = json.loads(pathlib.Path('update/source.json').read_text())
          application = next((a for a in source['applications'] if a['name'] == name), None)
          if application is None:
              known = ', '.join(a['name'] for a in source['applications'])
              raise SystemExit(f'tag {tag}: unknown extension "{name}"; update/source.json has {known}')
          path = pathlib.Path(f'metadata/{name}/versions.json')
          latest = max(json.loads(path.read_text())['versions'], key=lambda v: v['code'])
          if latest['name'] != version:
              raise SystemExit(f'tag {tag}: {path} newest version is {latest["name"]}')
          archive = application['archive']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'name={name}\n')
              f.write(f'code={latest["code"]}\n')
              f.write(f'archive={archive}\n')
              f.write(f'apk=chans/{name}/build/outputs/apk/release/{archive}-release.apk\n')
          print(f'{tag} builds {name} version code {latest["code"]}')
          EOF

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Add build-tools to PATH
        run: |
          latest=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          echo "$ANDROID_HOME/build-tools/$latest" >> "$GITHUB_PATH"

      - name: Decode signing keystore
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build the release APK
        env:
          KEYSTORE_FILENAME: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_SIGN_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_SIGN_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew ":chans:${{ steps.extension.outputs.name }}:assembleRelease"

      # The plugin falls back to the debug key when no keystore can be read, which would
      # otherwise produce a green build whose APK can never update a real install.
      - name: Verify the APK carries the release signature
        env:
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          APK: ${{ steps.extension.outputs.apk }}
        run: |
          expected=$(keytool -list -v -keystore "$RUNNER_TEMP/release.keystore" \
              -storepass "$KEYSTORE_PASSWORD" -alias "$RELEASE_KEY_ALIAS" \
              | sed -n 's/^[[:space:]]*SHA256: //p' | head -1 | tr -d ':' | tr 'A-F' 'a-f')
          if [ -z "$expected" ]; then
            echo "could not read the release certificate out of the keystore" >&2
            exit 1
          fi
          echo "expected signer: $expected"
          actual=$(apksigner verify --print-certs "$APK" \
              | sed -n 's/.*certificate SHA-256 digest: //p' | head -1 | tr 'A-F' 'a-f')
          if [ "$actual" != "$expected" ]; then
            echo "$APK is not signed with the release key (signer: $actual)" >&2
            exit 1
          fi
          echo "ok: $APK"

      - name: Prepare the release asset and changelog
        id: release_meta
        env:
          NAME: ${{ steps.extension.outputs.name }}
          CODE: ${{ steps.extension.outputs.code }}
          ARCHIVE: ${{ steps.extension.outputs.archive }}
          APK: ${{ steps.extension.outputs.apk }}
        run: |
          mkdir -p "$RUNNER_TEMP/assets"
          # Name the asset after the version code, matching source_template.
          cp "$APK" "$RUNNER_TEMP/assets/$ARCHIVE-$CODE.apk"
          changelog="metadata/$NAME/en/changelogs/$CODE.txt"
          if [ -f "$changelog" ]; then
            cp "$changelog" "$RUNNER_TEMP/body.md"
          else
            : > "$RUNNER_TEMP/body.md"
          fi
          echo "body=$RUNNER_TEMP/body.md" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: ${{ steps.release_meta.outputs.body }}
          files: ${{ runner.temp }}/assets/*.apk

      - name: Refresh update manifest on the default branch
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
          NAME: ${{ steps.extension.outputs.name }}
          APK: ${{ steps.extension.outputs.apk }}
        run: |
          git fetch origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
          git worktree add ../manifest "origin/$BRANCH"
          python3 scripts/update_manifest.py "$GITHUB_REF_NAME" ../manifest/update/data-v1.json \
              "$NAME" "$APK"
          cd ../manifest
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update/data-v1.json
          git commit -m "Update manifest for $GITHUB_REF_NAME" || exit 0
          git push origin "HEAD:$BRANCH"
